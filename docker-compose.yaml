x-app-base: &app-base
  build:
    context: .
    dockerfile: Dockerfile
    target: runtime
  env_file: .env

services:
  postgres:
    profiles: ["postgres-memory", "postgres-nats"]
    image: postgres:16
    environment:
      POSTGRES_DB: rss
      POSTGRES_USER: rss
      POSTGRES_PASSWORD: rss
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rss -d rss"]
      interval: 5s
      timeout: 3s
      retries: 20

  nats:
    profiles: ["sqlite-nats", "postgres-nats"]
    image: nats:2.12-alpine
    command: ["-js"]
    ports:
      - "127.0.0.1:4222:4222"
    volumes:
      - natsdata:/data

  rssd-sqlite-memory:
    <<: *app-base
    profiles: ["sqlite-memory"]
    command: ["/app/rssd"]
    environment:
      DB_DRIVER: sqlite
      DB_DSN: file:/data/rss.db
      QUEUE_DRIVER: inmem
      HTTP_ADDR: :8080
    volumes:
      - ./var/sqlite:/data
    ports:
      - "127.0.0.1:8080:8080"

  tg-bot-sqlite-memory:
    <<: *app-base
    profiles: ["sqlite-memory"]
    command: ["/app/tg-bot"]
    environment:
      DB_DRIVER: sqlite
      DB_DSN: file:/data/rss.db
      QUEUE_DRIVER: inmem
    volumes:
      - ./var/sqlite:/data

  rssd-postgres-memory:
    <<: *app-base
    profiles: ["postgres-memory"]
    command: ["/app/rssd"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_DRIVER: postgres
      DB_DSN: postgres://rss:rss@postgres:5432/rss?sslmode=disable
      QUEUE_DRIVER: inmem
      HTTP_ADDR: :8080
    ports:
      - "127.0.0.1:8080:8080"

  tg-bot-postgres-memory:
    <<: *app-base
    profiles: ["postgres-memory"]
    command: ["/app/tg-bot"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_DRIVER: postgres
      DB_DSN: postgres://rss:rss@postgres:5432/rss?sslmode=disable
      QUEUE_DRIVER: inmem

  rssd-sqlite-nats:
    <<: *app-base
    profiles: ["sqlite-nats"]
    command: ["/app/rssd"]
    depends_on:
      nats:
        condition: service_started
    environment:
      DB_DRIVER: sqlite
      DB_DSN: file:/data/rss.db
      QUEUE_DRIVER: nats
      NATS_URL: nats://nats:4222
      HTTP_ADDR: :8080
    volumes:
      - ./var/sqlite:/data
    ports:
      - "127.0.0.1:8080:8080"

  tg-bot-sqlite-nats:
    <<: *app-base
    profiles: ["sqlite-nats"]
    command: ["/app/tg-bot"]
    depends_on:
      nats:
        condition: service_started
    environment:
      DB_DRIVER: sqlite
      DB_DSN: file:/data/rss.db
      QUEUE_DRIVER: nats
      NATS_URL: nats://nats:4222
    volumes:
      - ./var/sqlite:/data

  rssd-postgres-nats:
    <<: *app-base
    profiles: ["postgres-nats"]
    command: ["/app/rssd"]
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    environment:
      DB_DRIVER: postgres
      DB_DSN: postgres://rss:rss@postgres:5432/rss?sslmode=disable
      QUEUE_DRIVER: nats
      NATS_URL: nats://nats:4222
      HTTP_ADDR: :8080
    ports:
      - "127.0.0.1:8080:8080"

  tg-bot-postgres-nats:
    <<: *app-base
    profiles: ["postgres-nats"]
    command: ["/app/tg-bot"]
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    environment:
      DB_DRIVER: postgres
      DB_DSN: postgres://rss:rss@postgres:5432/rss?sslmode=disable
      QUEUE_DRIVER: nats
      NATS_URL: nats://nats:4222

volumes:
  pgdata: {}
  natsdata: {}

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: rss
      POSTGRES_USER: rss
      POSTGRES_PASSWORD: rss
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rss -d rss"]
      interval: 5s
      timeout: 3s
      retries: 20

  rssd:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    command: ["/app/rssd"]
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  tg-bot:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    command: ["/app/tg-bot"]
    env_file: .env
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: {}

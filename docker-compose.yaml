services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: rss
      POSTGRES_USER: rss
      POSTGRES_PASSWORD: rss
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rss -d rss"]
      interval: 5s
      timeout: 3s
      retries: 20

  nats:
    image: nats:2.12-alpine
    command: ["-js"]
    ports:
      - "127.0.0.1:4222:4222"

  rssd:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    command: ["/app/rssd"]
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      nats:
        condition: service_started
    environment:
      HTTP_ADDR: :8080
    ports:
      - "127.0.0.1:8080:8080"

  tg-bot:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    command: ["/app/tg-bot"]
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      nats:
        condition: service_started

volumes:
  pgdata: {}
